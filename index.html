<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Roblox Deployment Downloader</title>

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="icon.png">

    <!-- Gotham Font (Montserrat Alternative) -->
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <!-- JSZip & FileSaver for zip generation -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>

    <!-- Twemoji -->
    <script src="https://cdn.jsdelivr.net/npm/@twemoji/api@latest/dist/twemoji.min.js" crossorigin="anonymous"></script>

    <style>
        :root {
            --rbx-topbar: #191919;
            --rbx-bg: #121314;
            --rbx-panel: #232527;
            --rbx-panel-inner: #191919;
            --rbx-border: #393b3d;
            --rbx-green: #00b259;
            --rbx-green-hover: #00964b;
            --rbx-blue: #00a2ff;
            --rbx-blue-hover: #0084d1;
            --rbx-text: #e3e3e3;
            --rbx-text-sub: #b8b8b8;
            --alert-bg: #2b2d2f;
            --alert-border: #3a3d40;
            --panel-shadow: none;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Gotham', 'Montserrat', -apple-system, sans-serif;
            background-color: var(--rbx-bg);
            color: var(--rbx-text);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Background Base Layer */
        .bg-overlay {
            position: fixed;
            inset: 0;
            background-image: url('bg.png');
            background-size: cover;
            background-position: center;
            filter: blur(10px);
            transform: scale(1.03);
            z-index: -2;
        }

        /* Smooth Dark Overlay Tint */
        .bg-overlay-tint {
            position: fixed;
            inset: 0;
            background-color: rgba(18, 19, 20, 0.78);
            z-index: -1;
        }

        /* Top Bar */
        header {
            height: 42px;
            background: var(--rbx-topbar);
            border-bottom: 1px solid var(--rbx-border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 16px;
        }

        .header-brand {
            display: flex;
            align-items: center;
            gap: 10px;
            color: var(--rbx-text);
            text-decoration: none;
            font-weight: 700;
            font-size: 14px;
        }

        .header-brand a {
            display: flex;
            align-items: center;
            text-decoration: none;
        }

        .header-brand .brand-logo {
            height: 23.1px;
            width: auto;
            object-fit: contain;
            transition: transform 0.15s ease;
        }

        .header-brand .brand-logo:hover {
            transform: scale(1.08);
        }

        /* Main Workspace Container */
        .main-container {
            max-width: 820px;
            width: 100%;
            margin: 28px auto;
            padding: 0 16px;
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        /* Classic Roblox Panel */
        .rbx-panel {
            background: var(--rbx-panel);
            border: 1px solid var(--rbx-border);
            border-radius: 3px;
            padding: 20px;
            box-shadow: var(--panel-shadow);
        }

        .rbx-panel-title {
            font-size: 18px;
            font-weight: 800;
            color: var(--rbx-text);
        }

        .rbx-panel-sub {
            font-size: 12px;
            color: var(--rbx-text-sub);
            margin-top: 4px;
        }

        .rbx-alert {
            background: var(--alert-bg);
            border: 1px solid var(--alert-border);
            border-left: 3px solid var(--rbx-blue);
            padding: 10px 12px;
            font-size: 12px;
            color: var(--rbx-text-sub);
            border-radius: 2px;
            margin-top: 12px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        /* Form Layout */
        .form-grid {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .form-row {
            display: grid;
            grid-template-columns: 180px 1fr;
            align-items: center;
            gap: 16px;
        }

        @media (max-width: 600px) {
            .form-row {
                grid-template-columns: 1fr;
                gap: 6px;
            }
        }

        .field-label {
            display: flex;
            flex-direction: column;
        }

        label {
            font-size: 13px;
            font-weight: 700;
            color: var(--rbx-text);
        }

        .label-opt {
            font-size: 11px;
            color: var(--rbx-text-sub);
        }

        input[type="text"], 
        input[type="number"], 
        select {
            height: 36px;
            background: var(--rbx-panel-inner);
            border: 1px solid var(--rbx-border);
            border-radius: 3px;
            color: var(--rbx-text);
            padding: 0 12px;
            font-family: inherit;
            font-size: 13px;
            outline: none;
        }

        input[type="text"]::placeholder {
            color: var(--rbx-text-sub);
            opacity: 0.7;
        }

        input[type="text"]:focus, 
        input[type="number"]:focus, 
        select:focus {
            border-color: var(--rbx-blue);
        }

        .checkbox-group {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 13px;
            color: var(--rbx-text-sub);
        }

        input[type="checkbox"] {
            width: 16px;
            height: 16px;
            accent-color: var(--rbx-blue);
            cursor: pointer;
        }

        .number-group {
            display: flex;
            align-items: center;
            gap: 10px;
            color: var(--rbx-text-sub);
            font-size: 12px;
        }

        .number-group input[type="number"] {
            width: 60px;
            text-align: center;
        }

        /* Action Buttons */
        .action-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-top: 8px;
        }

        @media (max-width: 480px) {
            .action-row {
                grid-template-columns: 1fr;
            }
        }

        .rbx-btn {
            height: 38px;
            border-radius: 3px;
            border: none;
            font-family: inherit;
            font-size: 13px;
            font-weight: 700;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            text-decoration: none;
            transition: background-color 0.1s ease;
        }

        .rbx-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .rbx-btn-green {
            background: var(--rbx-green);
            color: #ffffff;
            box-shadow: inset 0 -2px 0 rgba(0, 0, 0, 0.2);
        }

        .rbx-btn-green:hover:not(:disabled) {
            background: var(--rbx-green-hover);
        }

        .rbx-btn-blue {
            background: var(--rbx-blue);
            color: #ffffff;
            box-shadow: inset 0 -2px 0 rgba(0, 0, 0, 0.2);
        }

        .rbx-btn-blue:hover:not(:disabled) {
            background: var(--rbx-blue-hover);
        }

        /* Status & Progress Box */
        .status-box {
            margin-top: 12px;
            padding: 12px;
            background: var(--rbx-panel-inner);
            border: 1px solid var(--rbx-border);
            border-radius: 3px;
            font-size: 12px;
            color: var(--rbx-text);
            display: none;
            word-break: break-all;
        }

        .status-box.active {
            display: block;
        }

        .progress-bar-container {
            width: 100%;
            height: 6px;
            background: var(--alert-bg);
            border-radius: 2px;
            margin-top: 8px;
            overflow: hidden;
            display: none;
        }

        .progress-bar {
            height: 100%;
            width: 0%;
            background: var(--rbx-green);
            transition: width 0.2s ease;
        }

        /* Footer & Projects Link */
        footer {
            background: var(--rbx-topbar);
            border-top: 1px solid var(--rbx-border);
            padding: 14px;
            text-align: center;
            font-size: 12px;
            color: var(--rbx-text-sub);
            margin-top: auto;
        }

        .footer-projects-link {
            color: var(--rbx-blue);
            text-decoration: none;
            font-weight: 600;
            transition: color 0.15s ease;
        }

        .footer-projects-link:hover {
            color: var(--rbx-text);
            text-decoration: underline;
        }

        img.emoji {
            height: 1.1em;
            width: 1.1em;
            margin: 0 0.1em;
            vertical-align: -0.15em;
        }
    </style>
</head>
<body>

    <div class="bg-overlay"></div>
    <div class="bg-overlay-tint"></div>

    <header>
        <div class="header-brand">
            <!-- Clicking the Roblox Icon takes you to Roblox.com! -->
            <a href="https://www.roblox.com" target="_blank" rel="noopener noreferrer" title="Go to Roblox.com">
                <img src="icon.png" alt="Roblox Logo" class="brand-logo" onerror="this.style.display='none'">
            </a>
            <span>Roblox Deployment Downloader</span>
        </div>
    </header>

    <div class="main-container">

        <!-- Top Panel -->
        <div class="rbx-panel">
            <div class="rbx-panel-title">RDD - Roblox Deployment Downloader</div>
            <div class="rbx-panel-sub">Unofficial • Made by Duckycash</div>
            
            <div class="rbx-alert">
                <i class="fa-solid fa-circle-info" style="color: var(--rbx-blue);"></i>
                <span>Fetch direct deployment archives straight from Roblox CDN servers. ⚡</span>
            </div>
        </div>

        <!-- Configuration Panel -->
        <div class="rbx-panel">
            <div class="form-grid">

                <!-- Binary Type -->
                <div class="form-row">
                    <div class="field-label">
                        <label for="binaryType">Binary Type</label>
                    </div>
                    <select id="binaryType">
                        <option value="WindowsPlayer">WindowsPlayer</option>
                        <option value="WindowsStudio">WindowsStudio</option>
                        <option value="MacPlayer">MacPlayer</option>
                        <option value="MacStudio">MacStudio</option>
                    </select>
                </div>

                <!-- Channel -->
                <div class="form-row">
                    <div class="field-label">
                        <label for="channelInput">Channel</label>
                    </div>
                    <input type="text" id="channelInput" value="LIVE" placeholder="LIVE">
                </div>

                <!-- Version Hash -->
                <div class="form-row">
                    <div class="field-label">
                        <label for="versionHash">Version Hash</label>
                        <span class="label-opt">optional</span>
                    </div>
                    <input type="text" id="versionHash" placeholder="version-a1b2c3d4e5f6">
                </div>

                <!-- Compress Zip -->
                <div class="form-row">
                    <div class="field-label">
                        <label>Compress Zip</label>
                    </div>
                    <div class="checkbox-group">
                        <input type="checkbox" id="compressZip">
                        <span>Reduce file size / bundle package files into .zip</span>
                    </div>
                </div>

                <!-- Compression Level -->
                <div class="form-row">
                    <div class="field-label">
                        <label for="compressLevel">Compression Level</label>
                    </div>
                    <div class="number-group">
                        <input type="number" id="compressLevel" value="5" min="1" max="9">
                        <span>1 - 9</span>
                    </div>
                </div>

                <!-- Action Buttons -->
                <div class="action-row">
                    <button class="rbx-btn rbx-btn-green" id="downloadBtn">
                        <i class="fa-solid fa-download"></i> Download
                    </button>
                    <button class="rbx-btn rbx-btn-blue" id="copyBtn">
                        <i class="fa-regular fa-copy"></i> Copy Link
                    </button>
                </div>

                <!-- Status & Progress Box -->
                <div class="status-box" id="statusBox">
                    <span id="statusText">Ready</span>
                    <div class="progress-bar-container" id="progressContainer">
                        <div class="progress-bar" id="progressBar"></div>
                    </div>
                </div>

            </div>
        </div>

    </div>

    <footer>
        <p>Roblox Version Downloader • <a href="https://github.com" target="_blank" class="footer-projects-link"><i class="fa-solid fa-code"></i> My Projects</a></p>
    </footer>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            twemoji.parse(document.body);
        });

        // Downloader Core Logic
        const binaryType = document.getElementById('binaryType');
        const channelInput = document.getElementById('channelInput');
        const versionHash = document.getElementById('versionHash');
        const compressZip = document.getElementById('compressZip');
        const compressLevel = document.getElementById('compressLevel');
        
        const downloadBtn = document.getElementById('downloadBtn');
        const copyBtn = document.getElementById('copyBtn');
        
        const statusBox = document.getElementById('statusBox');
        const statusText = document.getElementById('statusText');
        const progressContainer = document.getElementById('progressContainer');
        const progressBar = document.getElementById('progressBar');

        const binaryLauncherMap = {
            WindowsPlayer: 'RobloxPlayerLauncher.exe',
            WindowsStudio: 'RobloxStudioLauncher.exe',
            MacPlayer: 'Roblox.dmg',
            MacStudio: 'RobloxStudio.dmg'
        };

        const defaultPackagesMap = {
            WindowsPlayer: [
                'RobloxPlayerLauncher.exe',
                'RobloxPlayerBeta.dll',
                'content-textures2.zip',
                'content-terrain.zip',
                'extracontent-luapackages.zip'
            ],
            WindowsStudio: [
                'RobloxStudioLauncher.exe',
                'RobloxStudio.zip',
                'content-qt_models.zip'
            ],
            MacPlayer: ['Roblox.dmg'],
            MacStudio: ['RobloxStudio.dmg']
        };

        async function resolveVersionHash() {
            let userHash = versionHash.value.trim();
            if (userHash) return userHash;

            const channel = channelInput.value.trim() || 'LIVE';
            const isLive = channel.toUpperCase() === 'LIVE';

            const versionUrl = isLive
                ? `https://setup.rbxcdn.com/version`
                : `https://setup.rbxcdn.com/channel/${channel.toLowerCase()}/version`;

            const proxyUrl = `https://corsproxy.io/?${encodeURIComponent(versionUrl)}`;

            try {
                updateStatus(`Resolving latest version for channel ${channel}...`);
                const response = await fetch(proxyUrl);
                if (!response.ok) throw new Error('Could not fetch version hash');
                const fetchedHash = (await response.text()).trim();
                return fetchedHash;
            } catch (err) {
                try {
                    const fallbackProxy = `https://api.allorigins.win/raw?url=${encodeURIComponent(versionUrl)}`;
                    const response = await fetch(fallbackProxy);
                    const fetchedHash = (await response.text()).trim();
                    return fetchedHash;
                } catch (fallbackErr) {
                    throw new Error('Failed to resolve version hash. Please specify one manually.');
                }
            }
        }

        function getCdnPrefix(version) {
            const channel = channelInput.value.trim() || 'LIVE';
            const isLive = channel.toUpperCase() === 'LIVE';

            return isLive
                ? `https://setup.rbxcdn.com/${version}-`
                : `https://setup.rbxcdn.com/channel/${channel.toLowerCase()}/${version}-`;
        }

        function updateStatus(msg, showProgress = false, percent = 0) {
            statusBox.classList.add('active');
            statusText.innerHTML = msg;
            twemoji.parse(statusText);

            if (showProgress) {
                progressContainer.style.display = 'block';
                progressBar.style.width = `${percent}%`;
            } else {
                progressContainer.style.display = 'none';
            }
        }

        copyBtn.addEventListener('click', async () => {
            try {
                copyBtn.disabled = true;
                const version = await resolveVersionHash();
                const prefix = getCdnPrefix(version);
                const file = binaryLauncherMap[binaryType.value] || 'RobloxPlayerLauncher.exe';
                const finalUrl = prefix + file;

                await navigator.clipboard.writeText(finalUrl);
                updateStatus(`<strong>Link Copied to Clipboard!</strong><br><a href="${finalUrl}" target="_blank" style="color: var(--rbx-blue);">${finalUrl}</a>`);
            } catch (err) {
                updateStatus(`<span style="color: #ff5555;">⚠️ ${err.message}</span>`);
            } finally {
                copyBtn.disabled = false;
            }
        });

        downloadBtn.addEventListener('click', async () => {
            try {
                downloadBtn.disabled = true;
                const version = await resolveVersionHash();
                const prefix = getCdnPrefix(version);
                const type = binaryType.value;

                if (!compressZip.checked) {
                    const file = binaryLauncherMap[type] || 'RobloxPlayerLauncher.exe';
                    const downloadUrl = prefix + file;
                    
                    updateStatus(`Starting download for ${file}...`);
                    window.open(downloadUrl, '_blank');
                } else {
                    const level = parseInt(compressLevel.value) || 5;
                    const packageList = defaultPackagesMap[type] || defaultPackagesMap.WindowsPlayer;
                    
                    const zip = new JSZip();
                    let completed = 0;

                    updateStatus(`Bundling ${packageList.length} files into zip...`, true, 0);

                    for (const fileName of packageList) {
                        const fileUrl = prefix + fileName;
                        const proxyUrl = `https://corsproxy.io/?${encodeURIComponent(fileUrl)}`;

                        try {
                            const res = await fetch(proxyUrl);
                            if (!res.ok) throw new Error(`Failed file: ${fileName}`);
                            const blob = await res.blob();
                            zip.file(fileName, blob);
                        } catch (e) {
                            console.warn(`Skipped ${fileName} due to fetch block`);
                        }

                        completed++;
                        const percent = Math.round((completed / packageList.length) * 80);
                        updateStatus(`Downloading ${fileName} (${completed}/${packageList.length})...`, true, percent);
                    }

                    updateStatus(`Compressing ZIP (Level ${level})...`, true, 90);
                    
                    const zipContent = await zip.generateAsync({
                        type: 'blob',
                        compression: 'DEFLATE',
                        compressionOptions: { level: level }
                    }, (metadata) => {
                        const percent = 90 + Math.round(metadata.percent * 0.1);
                        updateStatus(`Compressing ZIP... ${Math.round(metadata.percent)}%`, true, percent);
                    });

                    saveAs(zipContent, `${type}-${version}.zip`);
                    updateStatus(`<strong>Download Complete!</strong> Package saved as ${type}-${version}.zip`);
                }
            } catch (err) {
                updateStatus(`<span style="color: #ff5555;">⚠️ ${err.message}</span>`);
            } finally {
                downloadBtn.disabled = false;
            }
        });
    </script>
</body>
</html>
